    .analysis{margin-top:14px;padding:14px;border-radius:12px;background:#f9fbff;border:1px dashed #cfd6ff;display:none;}
    .analysis h2{font-size:16px;margin:0 0 8px;}
    .analysis p{margin:6px 0;line-height:1.6;}
    .analysis ul{margin:8px 0 0 18px;}
    .analysis li{margin:6px 0;}

    .actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;}
    .btn{border-radius:12px;padding:10px 12px;border:1px solid #e6e6e6;background:#fff;cursor:pointer;font-size:14px;}
    .btn:hover{border-color:#cfd6ff;}
    .btn.primary{border-color:#cfd6ff;background:#f2f4ff;}
    .btn[disabled]{opacity:.6;cursor:not-allowed;}

    .divider{height:1px;background:#eee;margin:14px 0;}
    .hint{font-size:13px;opacity:.75;margin-top:10px; white-space: pre-wrap;}
  </style>
</head>

    // ====== 全域狀態 ======

    const analysisBox = document.getElementById("analysis");

    const nextBtn = document.getElementById("next");

    // ====== 工具 ======
    function renderScore() {
      sAI.textContent = score.AI;
      sSI.textContent = score.SI;
      sCI.textContent = score.CI;
      sMoney.textContent = score.Money;
    }

    // 只計加分或 0（不扣分）
    function normalizePts(pts) {
      return {
        AI: Math.max(0, pts.AI || 0),
        SI: Math.max(0, pts.SI || 0),
        CI: Math.max(0, pts.CI || 0),
        Money: Math.max(0, pts.Money || 0),
      };
    }

    function fmtDelta(pts) {
      const p = normalizePts(pts || {});
      const parts = [];
      const add = (k, v) => { if (!v) return; parts.push(`${k}+${v}`); };
      add("$", p.Money);
      add("SI", p.SI);
      add("CI", p.CI);
      add("AI", p.AI);
      return parts.length ? `（${parts.join("；")}）` : "（沒有獎勵點數）";
    }

    function clearAnalysis() {
      analysisText.textContent = "";
      analysisBullets.innerHTML = "";
      analysisBox.style.display = "none";
    }

    // 顯示層：把 BI 字樣改成 SI；把 -分 顯示成 +0（不改原題目文字，只影響結果分析顯示）
    function sanitizeBulletText(text) {
      let t = String(text).replace(/\bBI\b/g, "SI");
      t = t
        .replace(/(\bAI|\bSI|\bCI)\s*-\s*\d+/g, "$1 +0")
        .replace(/\$\s*-\s*\d+/g, "$ +0")
        .replace(/💰\s*\$\s*-\s*\d+/g, "💰 $ +0")
        .replace(/🤝\s*SI\s*-\s*\d+/g, "🤝 SI +0")
        .replace(/❤️\s*CI\s*-\s*\d+/g, "❤️ CI +0")
        .replace(/🤖\s*AI\s*-\s*\d+/g, "🤖 AI +0");
      return t;
    }

    function showAnalysis(opt, bracket) {
      analysisText.textContent = `你選了 ${opt.key}. ${opt.text} ${bracket}。${opt.lead || ""}`;
      const bullets = (opt.bullets || []).map(t => `<li>${sanitizeBulletText(t)}</li>`).join("");
      analysisBullets.innerHTML = bullets;
      analysisBox.style.display = "block";
      delta.textContent = bracket;
    }

    function applyPts(pts, mult=1) {
      const p = normalizePts(pts || {});
      score.AI += p.AI * mult;
      score.SI += p.SI * mult;
      score.CI += p.CI * mult;
      score.Money += p.Money * mult;
    }

    function setAnsweredUI(optionKey, bracket) {
      picked.textContent = `已作答：選項 ${optionKey}`;
      delta.textContent = bracket;
      nextBtn.disabled = false;
    }

    function setUnansweredUI() {
      picked.textContent = "尚未作答";
      delta.textContent = "尚未計分";
      nextBtn.disabled = true;
      clearAnalysis();
    }

    // ====== 渲染題目 ======
    function renderQuestion() {
      const q = QUESTIONS[currentIndex];
      progress.textContent = `第 ${currentIndex + 1} / ${QUESTIONS.length} 題`;
      qTitle.innerHTML = `<strong>${q.id}.</strong> ${q.title}`;
      qSub.textContent = q.scene ? q.scene : "";

      optionsBox.innerHTML = "";
      clearAnalysis();

      const existing = answers.get(currentIndex);

      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "opt";
        btn.type = "button";
        btn.textContent = `${opt.key}. ${opt.text}`;

        if (existing) {
          btn.disabled = true;
          if (existing.optionKey === opt.key) btn.style.borderColor = "#cfd6ff";
        }

        btn.addEventListener("click", () => onPickOption(opt));
        optionsBox.appendChild(btn);
      });

      prevBtn.disabled = currentIndex === 0;
      nextBtn.textContent = (currentIndex === QUESTIONS.length - 1) ? "完成" : "下一題";

      if (existing) {
        const pickedOpt = q.options.find(o => o.key === existing.optionKey);
        const bracket = fmtDelta(existing.pts);
        setAnsweredUI(existing.optionKey, bracket);
        showAnalysis(pickedOpt, bracket);
      } else {
        setUnansweredUI();
      }

      renderScore();
    }

    // ====== 作答（確認送出 + 不扣分） ======
    function onPickOption(opt) {
      if (answers.get(currentIndex)) return;

      const ok = window.confirm(`你確定要選擇 ${opt.key} 嗎？\n送出後將無法更改。`);
      if (!ok) return;

      const pts = opt.pts || {};
      applyPts(pts, 1);
      answers.set(currentIndex, { optionKey: opt.key, pts });

      optionsBox.querySelectorAll("button.opt").forEach(b => b.disabled = true);

      const bracket = fmtDelta(pts);
      setAnsweredUI(opt.key, bracket);
      showAnalysis(opt, bracket);
      renderScore();

      const btns = Array.from(optionsBox.querySelectorAll("button.opt"));
      const chosen = btns.find(b => b.textContent.startsWith(opt.key + "."));
      if (chosen) chosen.style.borderColor = "#cfd6ff";
    }

    // ====== 導航 ======
    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (!answers.get(currentIndex)) return;

      if (currentIndex < QUESTIONS.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        analysisBox.style.display = "block";
        analysisText.textContent = `✅ 你已完成全部 ${QUESTIONS.length} 題！最終積分如下：`;
        analysisBullets.innerHTML = `
          <li><strong>AI：</strong>${score.AI}</li>
          <li><strong>SI：</strong>${score.SI}</li>
          <li><strong>CI：</strong>${score.CI}</li>
          <li><strong>$：</strong>${score.Money}</li>
        `;
        picked.textContent = "全部完成";
        delta.textContent = "—";
        nextBtn.disabled = true;
      }
    });

    // 初始
    renderQuestion();
  </script>
</body>
</html>
